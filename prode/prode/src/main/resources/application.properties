spring.application.name=prode

# Importa de forma opcional el archivo .env local como propiedades de Spring Boot.
# Esto permite que la aplicacion y los tests resuelvan placeholders como ${DB_URL}
# sin subir secretos al repositorio. Si no existe .env, Spring usa variables reales del sistema.
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL.
# Spring Boot reemplaza ${DB_URL}, ${DB_USERNAME} y ${DB_PASSWORD} por variables de entorno.
# No escribir contrasenas reales en este archivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA/Hibernate para desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto donde escuchara la API REST (8080 por defecto; para HTTPS local se suele usar 8443).
server.port=${SERVER_PORT:8080}

# HTTPS (RNF1): DESACTIVADO por defecto (HTTP local). Se activa por variables de entorno,
# sin versionar el keystore ni su contrasena. El .p12 NO va al repo (ver .gitignore).
# Para HTTPS local: generar el keystore en ./certs (ver DOCUMENTACION.md) y definir
# SSL_ENABLED=true junto con SSL_KEYSTORE_PASSWORD.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:file:./certs/prode-keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:prode}

# Configuracion de JWT.
# JWT_SECRET firma el token y no debe subirse con un valor real al repositorio.
app.jwt.secret=${JWT_SECRET}

# Tiempo de vida del token en milisegundos.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Usuario administrador inicial.
# Estos valores vienen de variables de entorno para no dejar credenciales hardcodeadas.
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
