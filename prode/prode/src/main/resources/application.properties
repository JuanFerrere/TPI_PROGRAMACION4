spring.application.name=prode

# Conexión a PostgreSQL local. Reemplazar MI_PASSWORD por la contraseña real del usuario postgres.
spring.datasource.url=jdbc:postgresql://localhost:5432/prode_db
spring.datasource.username=postgres
spring.datasource.password=greta20057
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate para desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto HTTP donde escuchará la API REST.
server.port=8080

# Clave usada para firmar los JWT en desarrollo.
# En producción no debería quedar escrita en este archivo: debería venir desde una variable de entorno.
app.jwt.secret=CAMBIAR_ESTA_CLAVE_SECRETA_LARGA_PARA_DESARROLLO

# Tiempo de vida del token en milisegundos. 86400000 ms equivalen a 24 horas.
app.jwt.expiration-ms=86400000
